[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-buckingham"
version = "0.5.0"
description = "Agentic discovery of dimensionless scaling laws across physical regimes"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name="Ao Cheng"},{name="Lei Zhang"},{name="Guowei He"}]
dependencies = [
  "numpy>=2.1,<3", "pandas>=2.2,<4", "scipy>=1.14,<2", "scikit-learn>=1.5,<2",
  "sympy>=1.13,<2", "cma>=4,<5", "matplotlib>=3.9,<4", "ipython>=8,<10",
  "pydantic>=2.9,<3", "langchain>=1,<2", "langchain-openai>=1,<2", "langgraph>=1,<2",
  "openai>=2,<4", "python-dotenv>=1,<2",
]

[project.optional-dependencies]
app = ["streamlit>=1.55,<2","plotly>=6,<8"]
dev = ["pytest>=8,<10","pypdf>=6,<7","pillow>=11,<14"]

[project.scripts]
ai-buckingham = "ai_buckingham.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:Support for class-based.*:pydantic.warnings.PydanticDeprecatedSince20"]
