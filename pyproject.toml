[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-buckingham"
version = "1.0.0"
description = "Agentic discovery of dimensionless scaling laws across physical regimes"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "AI Buckingham contributors"}]
dependencies = [
  "numpy==2.4.0", "pandas==2.3.3", "scipy==1.16.3", "sympy==1.14.0",
  "scikit-learn==1.8.0", "cma==4.4.4", "matplotlib==3.10.8",
  "pydantic==2.12.5", "typing-extensions==4.15.0", "openai==2.14.0",
  "langchain-openai==1.1.6", "langchain-core==1.2.5", "langgraph==1.0.5",
  "ipython==9.8.0", "httpx==0.28.1", "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
app = ["streamlit==1.67.0", "plotly==7.1.0"]
notebooks = ["nbformat==5.11.1", "nbclient==0.11.0", "nbconvert==7.17.2", "ipykernel==7.1.0"]
dev = ["pytest==9.2.0"]

[project.scripts]
ai-buckingham = "ai_buckingham.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
