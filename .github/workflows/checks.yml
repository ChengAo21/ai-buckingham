name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[app,notebooks,dev]'
      - run: python -m pytest -q
      - run: python reproduction/verify_integrity.py
      - run: python scripts/validate_results.py
      - run: python scripts/check_publication.py
      - run: python scripts/check_app.py
      - run: python scripts/check_web.py
