name: Publish research page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static research page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the static site from recorded results
        run: python scripts/build_pages.py
      - name: Check the static entry point
        run: python -c "from pathlib import Path; assert Path('site/index.html').is_file(), 'Missing site/index.html'"
      - name: Upload only the static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: Deploy research page
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy the static artifact
        id: deployment
        uses: actions/deploy-pages@v5
