<rect x="430" y="456" width="4" height="168" rx="2" fill="#268F88"/>
<text x="448" y="486" fill="#159F94" font-family="Arial, sans-serif" font-size="15" font-weight="700" >05</text>
<text x="480" y="488" fill="#143342" font-family="Arial, sans-serif" font-size="21" font-weight="600" >Learn the scaling</text>
<text x="449" y="521" fill="#45606C" font-family="Arial, sans-serif" font-size="18" font-weight="400" >MI objective · CMA-ES / scalar search</text>
<text x="449" y="548" fill="#45606C" font-family="Arial, sans-serif" font-size="18" font-weight="400" >Type I: keep the response unchanged</text>
<text x="449" y="575" fill="#45606C" font-family="Arial, sans-serif" font-size="18" font-weight="400" >Type II: learn output rescaling</text>
<text x="449" y="602" fill="#45606C" font-family="Arial, sans-serif" font-size="18" font-weight="400" >Select the number of groups</text>
<rect x="820" y="456" width="340" height="168" rx="8" fill="#EEF5F6" stroke="#CBDEE1"/>
<rect x="820" y="456" width="4" height="168" rx="2" fill="#268F88"/>
<text x="838" y="486" fill="#159F94" font-family="Arial, sans-serif" font-size="15" font-weight="700" >06</text>
<text x="870" y="488" fill="#143342" font-family="Arial, sans-serif" font-size="21" font-weight="600" >Simplify and validate</text>
<text x="839" y="521" fill="#45606C" font-family="Arial, sans-serif" font-size="18" font-weight="400" >Sparsify and rationalize</text>
<text x="839" y="548" fill="#45606C" font-family="Arial, sans-serif" font-size="18" font-weight="400" >Separate GPR collapse validation</text>
<text x="839" y="575" fill="#45606C" font-family="Arial, sans-serif" font-size="18" font-weight="400" >Preserve the numerical evidence</text>
