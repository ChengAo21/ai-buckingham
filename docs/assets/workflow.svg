<text x="90" y="206" fill="#143342" font-family="Arial, sans-serif" font-size="21" font-weight="600" >Formulate the problem</text>
<text x="59" y="239" fill="#45606C" font-family="Arial, sans-serif" font-size="18" font-weight="400" >Natural language + observations</text>
<text x="59" y="266" fill="#45606C" font-family="Arial, sans-serif" font-size="18" font-weight="400" >Identify quantities and response</text>
<rect x="430" y="174" width="340" height="130" rx="8" fill="#EEF5F6" stroke="#CBDEE1"/>
<rect x="430" y="174" width="4" height="130" rx="2" fill="#268F88"/>
<text x="448" y="204" fill="#159F94" font-family="Arial, sans-serif" font-size="15" font-weight="700" >02</text>
<text x="480" y="206" fill="#143342" font-family="Arial, sans-serif" font-size="21" font-weight="600" >Audit the dimensions</text>
<text x="449" y="239" fill="#45606C" font-family="Arial, sans-serif" font-size="18" font-weight="400" >Retrieve physical-quantity records</text>
<text x="449" y="266" fill="#45606C" font-family="Arial, sans-serif" font-size="18" font-weight="400" >Check SI exponents and citations</text>
<rect x="820" y="174" width="340" height="130" rx="8" fill="#EEF5F6" stroke="#CBDEE1"/>
<rect x="820" y="174" width="4" height="130" rx="2" fill="#268F88"/>
<text x="838" y="204" fill="#159F94" font-family="Arial, sans-serif" font-size="15" font-weight="700" >03</text>
<text x="870" y="206" fill="#143342" font-family="Arial, sans-serif" font-size="21" font-weight="600" >Construct the basis</text>
<text x="839" y="239" fill="#45606C" font-family="Arial, sans-serif" font-size="18" font-weight="400" >Symbolic null space of D</text>
<text x="839" y="266" fill="#45606C" font-family="Arial, sans-serif" font-size="18" font-weight="400" >Plan policies and constraints</text>
