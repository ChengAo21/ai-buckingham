<rect x="40" y="685" width="1120" height="107" rx="9" fill="#103C49"/>
<text x="63" y="723" fill="#85D4C9" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">SYNTHESIS &amp; EVIDENCE</text>
<text x="63" y="756" fill="#F5FAFB" font-family="Georgia, serif" font-size="24" font-weight="400" >Physical interpretation with retrieved relations</text>
<text x="63" y="781" fill="#C0DFE2" font-family="Arial, sans-serif" font-size="18" font-weight="400" >Scaling laws · result cards · numerical tables · figures · run provenance</text>
<text x="749" y="716" fill="#C0DFE2" font-family="Arial, sans-serif" font-size="16" font-weight="400" >Conditional validation evaluates the</text>
<text x="749" y="739" fill="#C0DFE2" font-family="Arial, sans-serif" font-size="16" font-weight="400" >selected representation; it does not</text>
<text x="749" y="762" fill="#C0DFE2" font-family="Arial, sans-serif" font-size="16" font-weight="400" >retrain the complete discovery workflow.</text>
