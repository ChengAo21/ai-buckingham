<text x="396" y="166" fill="#6D8B94" font-family="Arial, sans-serif" font-size="15" font-weight="400" >revision when needed</text>
<rect x="40" y="456" width="340" height="168" rx="8" fill="#EEF5F6" stroke="#CBDEE1"/>
